{% extends "base.html" %}
{% block title %}Register — ParallelVision{% endblock %}
{% block body %}
<header class="top"><div class="brand">PARALLEL VISION<small>PDC IMAGE PROCESSING ENGINE</small></div></header>
<div class="card auth-card">
  <h2>CREATE ACCOUNT</h2>
  <p class="sub">Your processed images are stored privately under your account.</p>
  {% include "_flash.html" %}
  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
    <label for="password">Password (min 8 characters)</label>
    <input type="password" id="password" name="password" minlength="8" required>
    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" name="confirm" minlength="8" required>
    <button class="btn solid" type="submit">REGISTER</button>
  </form>
  <div class="alt">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></div>
</div>
{% endblock %}
